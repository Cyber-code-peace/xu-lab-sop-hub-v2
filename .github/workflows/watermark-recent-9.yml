name: Watermark recent 9 PDFs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/watermark-recent-9.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watermark-recent-9
  cancel-in-progress: false

jobs:
  watermark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Apply confirmed Xu Lab watermark to the 9 recent PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz
          import math
          import os
          import zipfile
          from pathlib import Path

          TEXT = "仅供Xu Lab内部学习"
          OPACITY = 0.40
          BASE_FONT_SIZE = 32.79
          ANGLE = 45.0
          TARGETS = [
              "experiment/biorender绘图入门-wpy.pdf",
              "experiment/Figure Database.pdf",
              "experiment/ZYC整理作图-传workshop.pdf",
              "experiment/CCK8.pdf",
              "experiment/Graphpad-Prism-5.0-解析.pdf",
              "experiment/使用Endnote在Office Word中插入文献的方法.pdf",
              "experiment/动物药物体内使用浓度折算方式-26.8.7.pdf",
              "experiment/细胞计数法.pdf",
              "experiment/预测启动子结合序列示意图画法教程.pdf",
          ]

          def trace_text(span):
              out = []
              for ch in (span.get("chars") or ()):
                  try:
                      out.append(chr(int(ch[0])))
                  except Exception:
                      pass
              return "".join(out)

          def has_watermark(page):
              return sum(1 for s in page.get_texttrace() if TEXT in trace_text(s)) >= 1

          def put_mark(page, x, y, font_size):
              pt = fitz.Point(x, y)
              matrix = fitz.Matrix(1, 1).prerotate(ANGLE)
              page.insert_text(
                  pt,
                  TEXT,
                  fontsize=font_size,
                  fontname="china-s",
                  color=(0.55, 0.55, 0.55),
                  fill_opacity=OPACITY,
                  morph=(pt, matrix),
                  overlay=True,
              )

          changed = []
          already = []
          qa = []

          for target in TARGETS:
              path = Path(target)
              if not path.exists():
                  raise SystemExit(f"Missing target: {target}")
              doc = fitz.open(path)
              before = [has_watermark(p) for p in doc]
              if all(before):
                  already.append(target)
                  doc.close()
                  continue

              for pno, page in enumerate(doc):
                  if before[pno]:
                      continue
                  w = float(page.rect.width)
                  h = float(page.rect.height)
                  scale = math.sqrt((w * h) / (595.22 * 842.0))
                  fs = max(18.0, BASE_FONT_SIZE * scale)

                  # Recreate the historical appearance: 3 x 3 diagonal repeated text per page.
                  xs = (0.16 * w, 0.43 * w, 0.70 * w)
                  ys = (0.28 * h, 0.55 * h, 0.82 * h)
                  for y in ys:
                      for x in xs:
                          put_mark(page, x, y, fs)

              tmp = path.with_suffix(path.suffix + ".tmp")
              doc.save(tmp, garbage=4, deflate=True)
              doc.close()
              os.replace(tmp, path)

              check = fitz.open(path)
              try:
                  missing = [i + 1 for i, p in enumerate(check) if not has_watermark(p)]
                  if missing:
                      raise SystemExit(f"QA failed: {target} pages without watermark: {missing[:20]}")
                  for pno in sorted(set([0, len(check) // 2, len(check) - 1])):
                      pix = check[pno].get_pixmap(matrix=fitz.Matrix(1.25, 1.25), alpha=False)
                      if pix.width < 100 or pix.height < 100 or len(pix.samples) < 10000:
                          raise SystemExit(f"QA failed render: {target} page {pno + 1}")
                  qa.append((target, len(check)))
              finally:
                  check.close()
              changed.append(target)

          zip_path = Path("downloads/all-sop-pdfs.zip")
          zip_tmp = zip_path.with_suffix(".zip.tmp")
          with zipfile.ZipFile(zip_tmp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for pdf in sorted(Path("experiment").glob("*.pdf"), key=lambda p: p.name.casefold()):
                  zf.write(pdf, arcname=pdf.name)
          os.replace(zip_tmp, zip_path)

          print("Watermark:", TEXT)
          print("Opacity:", OPACITY)
          print("Base font size:", BASE_FONT_SIZE)
          print("Angle:", ANGLE)
          print("Changed:", changed)
          print("Already watermarked:", already)
          print("QA:", qa)
          if len(changed) + len(already) != len(TARGETS):
              raise SystemExit("Target accounting mismatch")
          PY

      - name: Commit verified PDFs to review branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="watermark/recent-9-20260824"
          git config user.name "Xu Lab SOP Hub"
          git config user.email "actions@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add experiment downloads/all-sop-pdfs.zip
          test -n "$(git diff --cached --name-only)"
          git commit -m "Watermark 9 recent experiment PDFs"
          git push --force origin "HEAD:refs/heads/$BRANCH"
