name: One-off watermark recent PDFs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/watermark-recent-pdfs.yml

permissions:
  contents: write

jobs:
  watermark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Infer historical watermark and apply only where missing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz
          import math
          import os
          import statistics
          import subprocess
          import tempfile
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          WATERMARK_COMMIT = "2f11afddb9274d65eb74a0355ae85b7d53976bba"
          ORIGINAL_COMMIT = "59fae2e2d190eb59d3b75ff77e01b3da30dd1cf8"
          TARGETS = [
              "experiment/biorender绘图入门-wpy.pdf",
              "experiment/Figure Database.pdf",
              "experiment/ZYC整理作图-传workshop.pdf",
              "experiment/CCK8.pdf",
              "experiment/Graphpad-Prism-5.0-解析.pdf",
              "experiment/使用Endnote在Office Word中插入文献的方法.pdf",
              "experiment/动物药物体内使用浓度折算方式-26.8.7.pdf",
              "experiment/细胞计数法.pdf",
              "experiment/预测启动子结合序列示意图画法教程.pdf",
          ]

          def run(*args, text=False):
              return subprocess.check_output(args, text=text)

          def span_text(span):
              chars = span.get("chars") or ()
              return "".join(chr(ch[0]) for ch in chars)

          def span_origin(span):
              chars = span.get("chars") or ()
              if chars:
                  return tuple(chars[0][2])
              b = span.get("bbox", (0, 0, 0, 0))
              return (b[0], b[3])

          def span_angle(span):
              d = span.get("dir", (1.0, 0.0))
              return math.degrees(math.atan2(-float(d[1]), float(d[0])))

          def angle_delta(a, b):
              return abs((a - b + 180.0) % 360.0 - 180.0)

          def same_existing(cur, old):
              if span_text(cur) != span_text(old):
                  return False
              co = span_origin(cur)
              oo = span_origin(old)
              if math.dist(co, oo) > 2.5:
                  return False
              if abs(float(cur.get("size", 0)) - float(old.get("size", 0))) > 0.8:
                  return False
              if angle_delta(span_angle(cur), span_angle(old)) > 1.5:
                  return False
              return True

          def unmatched_spans(cur_page, old_page):
              cur = list(cur_page.get_texttrace())
              old = list(old_page.get_texttrace())
              used = set()
              out = []
              for c in cur:
                  hit = None
                  for i, o in enumerate(old):
                      if i in used:
                          continue
                      if same_existing(c, o):
                          hit = i
                          break
                  if hit is None:
                      text = span_text(c).strip()
                      if text:
                          out.append(c)
                  else:
                      used.add(hit)
              return out

          ref_paths = run(
              "git", "diff", "--name-only", ORIGINAL_COMMIT, WATERMARK_COMMIT, "--", "experiment/*.pdf", text=True
          ).splitlines()
          ref_paths = [p for p in ref_paths if p.lower().endswith(".pdf") and Path(p).exists()]
          if len(ref_paths) < 5:
              raise SystemExit(f"Fail-safe: only {len(ref_paths)} historical watermarked reference PDFs found")

          by_text_docs = defaultdict(set)
          by_text_spans = defaultdict(list)
          page_candidates = []

          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              for ridx, ref in enumerate(ref_paths):
                  try:
                      old_bytes = run("git", "show", f"{ORIGINAL_COMMIT}:{ref}")
                  except subprocess.CalledProcessError:
                      continue
                  old_path = td / f"old-{ridx}.pdf"
                  old_path.write_bytes(old_bytes)
                  try:
                      cur_doc = fitz.open(ref)
                      old_doc = fitz.open(old_path)
                  except Exception:
                      continue
                  try:
                      n = min(len(cur_doc), len(old_doc), 2)
                      for pno in range(n):
                          extras = unmatched_spans(cur_doc[pno], old_doc[pno])
                          if not extras:
                              continue
                          w = float(cur_doc[pno].rect.width)
                          h = float(cur_doc[pno].rect.height)
                          page_candidates.append((ref, pno, w, h, extras))
                          for s in extras:
                              t = span_text(s).strip()
                              if len(t) < 2:
                                  continue
                              by_text_docs[t].add(ref)
                              by_text_spans[t].append(s)
                  finally:
                      cur_doc.close()
                      old_doc.close()

          if not by_text_docs:
              raise SystemExit("Fail-safe: no added text spans could be inferred from historical watermark commit")

          ranked = sorted(
              by_text_docs,
              key=lambda t: (len(by_text_docs[t]), len(by_text_spans[t]), len(t)),
              reverse=True,
          )
          best = ranked[0]
          best_docs = len(by_text_docs[best])
          threshold = max(3, math.ceil(best_docs * 0.55))
          watermark_texts = [
              t for t in ranked
              if len(by_text_docs[t]) >= threshold and len(t) >= 2
          ][:4]
          if best_docs < 3 or not watermark_texts:
              raise SystemExit(f"Fail-safe: watermark signature not stable enough; best text={best!r}, docs={best_docs}")

          style_stats = {}
          for t in watermark_texts:
              spans = by_text_spans[t]
              style_stats[t] = {
                  "opacity": statistics.median(float(s.get("opacity", 1.0)) for s in spans),
                  "size": statistics.median(float(s.get("size", 12.0)) for s in spans),
                  "angle": statistics.median(span_angle(s) for s in spans),
              }

          # A watermark should be visually subordinate. Refuse to infer normal document text.
          if all(style_stats[t]["opacity"] > 0.85 for t in watermark_texts):
              raise SystemExit(f"Fail-safe: inferred repeated text is too opaque to safely treat as watermark: {style_stats}")

          patterns = []
          for ref, pno, w, h, extras in page_candidates:
              marks = []
              for s in extras:
                  t = span_text(s).strip()
                  if t not in watermark_texts:
                      continue
                  origin = span_origin(s)
                  color = s.get("color", (0.5, 0.5, 0.5))
                  if isinstance(color, (int, float)):
                      color = (float(color),)
                  else:
                      color = tuple(float(x) for x in color)
                  marks.append({
                      "text": t,
                      "ox": float(origin[0]),
                      "oy": float(origin[1]),
                      "size": float(s.get("size", style_stats[t]["size"])),
                      "opacity": float(s.get("opacity", style_stats[t]["opacity"])),
                      "angle": span_angle(s),
                      "color": color,
                  })
              if marks:
                  patterns.append({"ref": ref, "pno": pno, "w": w, "h": h, "marks": marks})

          if len(patterns) < 3:
              raise SystemExit(f"Fail-safe: only {len(patterns)} usable historical watermark page patterns")

          def trace_has_watermark(page):
              found = 0
              traces = list(page.get_texttrace())
              for s in traces:
                  t = span_text(s).strip()
                  if t not in watermark_texts:
                      continue
                  st = style_stats[t]
                  if abs(float(s.get("opacity", 1.0)) - st["opacity"]) <= 0.20 and angle_delta(span_angle(s), st["angle"]) <= 8:
                      found += 1
              return found > 0

          def pick_pattern(page):
              w, h = float(page.rect.width), float(page.rect.height)
              ratio = w / h
              orientation = w >= h
              same_orientation = [p for p in patterns if (p["w"] >= p["h"]) == orientation]
              pool = same_orientation or patterns
              return min(pool, key=lambda p: abs(math.log((p["w"] / p["h"]) / ratio)))

          def font_for(text):
              return "china-s" if any(ord(ch) > 255 for ch in text) else "helv"

          changed = []
          already = []
          qa = []
          for target in TARGETS:
              path = Path(target)
              if not path.exists():
                  raise SystemExit(f"Fail-safe: expected recent PDF is missing: {target}")
              doc = fitz.open(path)
              page_flags = [trace_has_watermark(p) for p in doc]
              if all(page_flags):
                  already.append(target)
                  doc.close()
                  continue

              for pno, page in enumerate(doc):
                  if page_flags[pno]:
                      continue
                  pat = pick_pattern(page)
                  sx = float(page.rect.width) / pat["w"]
                  sy = float(page.rect.height) / pat["h"]
                  sf = math.sqrt(sx * sy)
                  for m in pat["marks"]:
                      pt = fitz.Point(m["ox"] * sx, m["oy"] * sy)
                      matrix = fitz.Matrix(1, 1).prerotate(m["angle"])
                      page.insert_text(
                          pt,
                          m["text"],
                          fontsize=max(6.0, m["size"] * sf),
                          fontname=font_for(m["text"]),
                          color=m["color"],
                          fill_opacity=max(0.02, min(0.80, m["opacity"])),
                          morph=(pt, matrix),
                          overlay=True,
                      )

              tmp = path.with_suffix(path.suffix + ".watermark.tmp")
              doc.save(tmp, garbage=4, deflate=True)
              doc.close()
              os.replace(tmp, path)

              # Structural QA: every page must now expose the historical watermark signature.
              check = fitz.open(path)
              try:
                  missing_pages = [i + 1 for i, p in enumerate(check) if not trace_has_watermark(p)]
                  if missing_pages:
                      raise SystemExit(f"QA failed: {target} missing inferred watermark on pages {missing_pages[:10]}")
                  # Renderer QA: render first and last page; fail on blank/corrupt output.
                  sample_pages = sorted(set([0, len(check) - 1]))
                  for pno in sample_pages:
                      pix = check[pno].get_pixmap(matrix=fitz.Matrix(1.25, 1.25), alpha=False)
                      samples = pix.samples
                      if not samples or len(samples) < 1000:
                          raise SystemExit(f"QA failed: render output invalid for {target} page {pno + 1}")
                  qa.append((target, len(check)))
              finally:
                  check.close()
              changed.append(target)

          # Rebuild the downloadable bundle so it contains the updated binaries.
          zip_path = Path("downloads/all-sop-pdfs.zip")
          zip_tmp = zip_path.with_suffix(".zip.tmp")
          with zipfile.ZipFile(zip_tmp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for pdf in sorted(Path("experiment").glob("*.pdf"), key=lambda p: p.name.casefold()):
                  zf.write(pdf, arcname=pdf.name)
          os.replace(zip_tmp, zip_path)

          print("=== Historical watermark inference ===")
          print("Reference PDFs:", len(ref_paths))
          print("Usable page patterns:", len(patterns))
          print("Watermark text(s):", watermark_texts)
          print("Style stats:", style_stats)
          print("Already watermarked recent PDFs:", already)
          print("Newly watermarked PDFs:", changed)
          print("QA page counts:", qa)
          print("Bundle rebuilt:", zip_path, zip_path.stat().st_size, "bytes")
          if len(changed) + len(already) != len(TARGETS):
              raise SystemExit("Fail-safe: target accounting mismatch")
          PY

      - name: Commit watermarked PDFs and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/watermark-recent-pdfs.yml
          git config user.name "Xu Lab SOP Hub"
          git config user.email "actions@users.noreply.github.com"
          git add -A experiment downloads/all-sop-pdfs.zip .github/workflows/watermark-recent-pdfs.yml
          if git diff --cached --quiet; then
            echo "No repository changes were needed."
            exit 0
          fi
          git commit -m "Watermark recent experiment PDFs"
          git push origin HEAD:main
